# Render Blueprint: one free Docker web service serving the API and the web app.
# Postgres (Neon), Redis (Upstash) and email (Mailjet) are external free services;
# their connection details are asked for when the Blueprint is first applied.
# Step-by-step guide: DEPLOY.md
services:
  - type: web
    name: casino
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: LOG_LEVEL
        value: info
      # Proxies Render puts in front of the app. Check /api/admin/client-ip after
      # deploying: "ip" must be your own address (see DEPLOY.md).
      - key: TRUST_PROXY_HOPS
        value: '3'
      # Public address, e.g. https://casino-xyz.onrender.com (no trailing slash).
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Render's free plan blocks SMTP ports, so email goes through the Gmail API (HTTPS).
      - key: MAIL_PROVIDER
        value: gmail
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      # e.g. "Casino <you@gmail.com>"; must be the Gmail account that granted the token.
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Secrets are generated by Render once and kept across deploys.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        sync: false
